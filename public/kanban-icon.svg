<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#141920"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#90FF7E"/>
      <stop offset="100%" style="stop-color:#7aafff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="72" height="72" rx="16" fill="url(#bg)"/>

  <!-- Column -->
  <rect x="14" y="8" width="44" height="56" rx="8" fill="#ffffff" opacity="0.05"/>
  <rect x="14" y="8" width="44" height="56" rx="8" fill="none" stroke="url(#card1)" stroke-width="1" opacity="0.25"/>

  <!-- Card 1 — bright gradient -->
  <rect x="20" y="15" width="32" height="11" rx="4" fill="url(#card1)" filter="url(#glow)"/>

  <!-- Card 2 — medium -->
  <rect x="20" y="31" width="32" height="11" rx="4" fill="url(#card1)" opacity="0.45"/>

  <!-- Card 3 — faint -->
  <rect x="20" y="47" width="32" height="11" rx="4" fill="url(#card1)" opacity="0.2"/>
</svg>
